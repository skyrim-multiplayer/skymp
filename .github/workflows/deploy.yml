name: Deploy

on:
    workflow_dispatch:
        inputs:
            action:
                description: 'Action'
                required: true
                type: choice
                options:
                    - 'deploy'
                    - 'restart'
                default: 'restart'
            branch:
                description: 'Branch, meaning server instance'
                required: true
                type: choice
                options:
                    - 'sweetpie'
                    - 'indev'
                default: 'indev'

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
          - name: Trigger server deploy job
            env:
              INSTALLER_REPOSITORY: ${{ vars.INSTALLER_REPOSITORY }}
              GH_TOKEN: ${{ secrets.SKYMP5_INSTALLER_REPOSITORY_DISPATCH_PAT }}
            run: |
              : "${INSTALLER_REPOSITORY:?Set the INSTALLER_REPOSITORY repository variable (owner/repo)}"
              gh workflow run server-build-deploy-1-5.yml --repo "$INSTALLER_REPOSITORY" \
                -f action='${{ inputs.action }}' \
                -f server_name='${{ inputs.branch }}' \
                -f real_triggering_actor='${{ github.triggering_actor }}' \
                ;
